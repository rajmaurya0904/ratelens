[project]
name = "ratelens"
version = "0.1.0"
description = "Curated dataset of public API rate limits (requests per minute, burst) in CSV/JSON form, helping developers avoid throttling surprises."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["click>=8.1"]

[project.scripts]
ratelens = "ratelens.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratelens*"]

[tool.setuptools.package-data]
ratelens = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = "tests"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
